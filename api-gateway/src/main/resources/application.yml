spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: attraction
              uri: lb://attraction
              predicates:
                - Path=/city/**, /attraction/**, /excursion/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**, /user/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/pay/**

            - id: ticket-service
              uri: lb://ticket-service
              predicates:
                - Path=/ticket/**
          discovery:
            locator:
              lower-case-service-id: true

Server:
  port: 8765
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    prefer-ip-address: true